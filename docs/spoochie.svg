<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Spoochie: un perro con gafas de sol que lleva recados entre dos maquinas. Dibujo propio. -->
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2A65A"/>
      <stop offset="1" stop-color="#D97B2B"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B3F4A"/>
      <stop offset="0.55" stop-color="#14161B"/>
      <stop offset="1" stop-color="#2A2E38"/>
    </linearGradient>
  </defs>

  <!-- fondo: el tunel -->
  <circle cx="256" cy="256" r="236" fill="#1F7A6D"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#155A50" stroke-width="14"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#2AA08F" stroke-width="10" stroke-dasharray="26 18"/>

  <!-- orejas -->
  <path d="M112 170 C 70 190, 62 300, 118 332 C 150 348, 172 300, 160 240 C 152 200, 140 170, 112 170 Z" fill="#B8601F" stroke="#5A2E0C" stroke-width="10" stroke-linejoin="round"/>
  <path d="M400 170 C 442 190, 450 300, 394 332 C 362 348, 340 300, 352 240 C 360 200, 372 170, 400 170 Z" fill="#B8601F" stroke="#5A2E0C" stroke-width="10" stroke-linejoin="round"/>

  <!-- cabeza -->
  <ellipse cx="256" cy="262" rx="150" ry="140" fill="url(#fur)" stroke="#5A2E0C" stroke-width="10"/>
  <!-- mancha clara del hocico -->
  <ellipse cx="256" cy="322" rx="84" ry="58" fill="#FBE3C2"/>

  <!-- gafas de sol -->
  <rect x="120" y="214" width="112" height="70" rx="26" fill="url(#glass)" stroke="#0B0C10" stroke-width="8"/>
  <rect x="280" y="214" width="112" height="70" rx="26" fill="url(#glass)" stroke="#0B0C10" stroke-width="8"/>
  <path d="M232 244 Q 256 230 280 244" fill="none" stroke="#0B0C10" stroke-width="10" stroke-linecap="round"/>
  <path d="M120 240 L 100 232" stroke="#0B0C10" stroke-width="10" stroke-linecap="round"/>
  <path d="M392 240 L 412 232" stroke="#0B0C10" stroke-width="10" stroke-linecap="round"/>
  <!-- reflejo -->
  <path d="M140 232 L 170 228" stroke="#A9B4C7" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <path d="M300 232 L 330 228" stroke="#A9B4C7" stroke-width="8" stroke-linecap="round" opacity="0.8"/>

  <!-- nariz y boca -->
  <ellipse cx="256" cy="310" rx="26" ry="18" fill="#2B1608"/>
  <path d="M256 328 L 256 348" stroke="#5A2E0C" stroke-width="8" stroke-linecap="round"/>
  <path d="M216 350 Q 256 384 296 350" fill="none" stroke="#5A2E0C" stroke-width="8" stroke-linecap="round"/>
  <!-- lengua -->
  <path d="M244 364 Q 256 392 268 364 Z" fill="#E5657A" stroke="#5A2E0C" stroke-width="6" stroke-linejoin="round"/>

  <!-- collar con chapa -->
  <path d="M150 386 Q 256 432 362 386" fill="none" stroke="#2AA08F" stroke-width="22" stroke-linecap="round"/>
  <path d="M150 386 Q 256 432 362 386" fill="none" stroke="#155A50" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="436" r="30" fill="#F6C453" stroke="#5A2E0C" stroke-width="8"/>
  <text x="256" y="449" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="36" text-anchor="middle" fill="#5A2E0C">s</text>
</svg>
