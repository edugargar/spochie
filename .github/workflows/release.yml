# Builds one self-contained binary per platform and attaches them to the release,
# so the SessionStart hook can fetch one when Bun is not installed.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      # Hasta 0.8 no habia dependencias y bun test corria sin node_modules; nostr-tools
      # llego con 0.9 y el demonio moria al importar, asi que todos los tests con demonio
      # caian en CI. El lock fijo: lo que se prueba es lo que se compila.
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: compile
        run: |
          mkdir -p dist
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            bun build --compile --target=bun-$t src/cli.ts --outfile dist/spoochie-$t
          done
          (cd dist && sha256sum spoochie-* > SHA256SUMS && cat SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/spoochie-*
            dist/SHA256SUMS
          generate_release_notes: true
